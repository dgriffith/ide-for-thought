# Dependabot supply-chain scanning (#1095 / QA H3).
#
# Minerva bundles a large native/WASM surface (onnxruntime, duckdb, pdfjs,
# tesseract, sql.js, isomorphic-git) and executes LLM-proposed content, so an
# unpatched transitive CVE is a real exposure. Dependabot surfaces those as
# update PRs; the non-blocking `pnpm audit` step in ci.yml is the paired
# visibility signal. Together they replace "notice a CVE by manual inspection".
version: 2

updates:
  # ── Application dependencies (pnpm uses the npm ecosystem) ────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Keep the noise low: batch minor + patch bumps into grouped PRs so the
    # weekly churn is a couple of reviews, not thirty. Majors still arrive as
    # individual PRs (they carry breaking-change risk and deserve their own
    # review) — but security fixes always open regardless of grouping.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # @retorquere/bibtex-parser 10.x is an upstream packaging bug: its
      # package.json advertises `types: ./dist/types/index.d.ts` but the
      # published tarball ships zero .d.ts files. The import degrades to
      # `any`, so the lint gate fails three ways — tsc (TS7016) and
      # svelte-check on the missing declaration file, plus 21
      # @typescript-eslint/no-unsafe-* errors in
      # src/main/sources/import-bibtex.ts.
      #
      # This is packaging, not API. parse() still takes `sentenceCase: false`,
      # still returns { entries, errors }, and entries still carry
      # type/key/fields/input; all 18 import-bibtex tests pass on 10.0.1.
      # Nothing here is worth a hand-written .d.ts shim that would silently
      # outrank the real types once they come back.
      #
      # Originally pinned at the exact broken 10.0.0 (#1464) on the assumption
      # a fix would follow; 10.0.1 shipped the same way (#1821), so widen to
      # the whole 10 line. Remove this entry — and re-check dist/types is
      # actually in the tarball — once upstream republishes declarations.
      - dependency-name: "@retorquere/bibtex-parser"
        versions: ["10.x"]

  # ── GitHub Actions themselves ────────────────────────────────────────────
  # The workflows pin actions by major tag (actions/checkout@v4, …); those
  # have their own supply-chain history, so keep them current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "build"
    commit-message:
      prefix: "chore(ci)"
