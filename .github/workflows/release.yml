# Release pipeline for Minerva (#660).
#
# Builds the macOS distributables (DMG + ZIP) via electron-forge make and
# publishes them. Two triggers:
#   - push a `v*` tag  → build + attach to a DRAFT GitHub Release for review
#   - workflow_dispatch → build + upload artifacts only (test the make path
#     without cutting a release)
#
# This closes the two gaps from build review B-H1: the `make` path was never
# exercised by CI (a maker regression stayed invisible until release day), and
# there was no tag→downloadable-build flow.
#
# Also uploads a stable-named DMG copy (Minerva-mac-arm64.dmg, no version in the
# name) alongside the version-stamped original, so the website's download button
# can link to a URL that never changes across releases (see "Collect artifacts").
#
# Signing + notarization (#959): when the Apple secrets below are configured,
# the "Prepare macOS signing" step imports the Developer ID cert into a throwaway
# keychain and exports the App Store Connect API-key env vars, so forge.config.ts
# takes its signed + notarized + stapled path. Without the secrets (e.g. a fork)
# the build still succeeds, unsigned — forge falls back automatically.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE_P12_BASE64  — `base64 -i DeveloperIDApp.p12` (Developer ID Application cert + key)
#   APPLE_CERTIFICATE_PASSWORD    — the .p12 export password
#   APPLE_API_KEY_BASE64          — `base64 -i AuthKey_XXXXXXXXXX.p8` (App Store Connect key)
#   APPLE_API_KEY_ID              — the key's 10-char Key ID
#   APPLE_API_ISSUER              — the App Store Connect Issuer ID (UUID)

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The release job needs to create a Release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # electron-forge package OOMs on the default heap when bundling the
      # renderer + native deps — match build:e2e (#373).
      NODE_OPTIONS: --max-old-space-size=4096
      # 'true' only when the signing cert secret is configured. `secrets` isn't
      # allowed directly in step `if:`, so we hoist the presence check to an env
      # flag the signing/cleanup steps gate on. A secretless run builds unsigned.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # node-linker=hoisted → node_modules is a self-contained flat tree (no
      # store symlinks), so caching it directly is safe. Same key as ci.yml's
      # "Cache node_modules" so the two workflows share a warm cache (#1638).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The release build otherwise trusts that whatever commit a tag points
      # at already passed CI — but a tag can point anywhere (a hotfix branch,
      # an old commit, a manually rebased ref), so assert it independently
      # rather than trusting an upstream check that may not have run against
      # this exact ref (#1638). Mirrors ci.yml's lint-and-test + audit jobs.
      - name: Lint (tsc + svelte-check + eslint)
        run: pnpm lint

      - name: Audit shipped dependencies (prod, high+critical)
        run: pnpm audit --prod --audit-level=high

      # Import the Developer ID cert into a throwaway keychain and stage the
      # App Store Connect API key, then export the paths/ids forge.config.ts
      # reads (APPLE_API_KEY / _KEY_ID / _ISSUER) via $GITHUB_ENV so the build
      # step below picks up the signed path. Secrets are decoded to files under
      # $RUNNER_TEMP and never echoed. Skipped (build stays unsigned) when the
      # signing secrets aren't configured.
      - name: Prepare macOS signing
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          API_KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          # Decode the secrets to files (base64 -D on macOS runners).
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"

          # Throwaway keychain holding just the Developer ID identity. Add it to
          # the search list so codesign / find-identity can see the cert.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT_PATH"

          # Hand forge the notarization creds + keychain path (for cleanup).
          {
            echo "APPLE_API_KEY=$API_KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Build distributables (electron-forge make)
        run: pnpm build

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist-artifacts/ \;

          # Stable-named copy of the DMG (#1300-adjacent: website download link),
          # alongside the version-stamped original. The versioned name changes
          # every release, so the website can't link to it directly — this fixed
          # name lets it link to a URL that never changes:
          #   .../releases/latest/download/Minerva-mac-arm64.dmg
          # which GitHub always redirects to whatever's currently published.
          dmg="$(find dist-artifacts -maxdepth 1 -name '*.dmg' | head -n1)"
          if [ -n "$dmg" ]; then
            cp "$dmg" dist-artifacts/Minerva-mac-arm64.dmg
          fi

          echo "Collected:"
          ls -la dist-artifacts

          # A DMG-only or ZIP-only release silently breaks something: the DMG
          # is the human download, the ZIP is the Squirrel.Mac auto-update
          # payload update.electronjs.org serves. Fail here, before drafting,
          # rather than have a maker regression ship quietly (#1639).
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found in dist-artifacts — the maker output is missing the human-downloadable installer."
            exit 1
          fi
          zip="$(find dist-artifacts -maxdepth 1 -name '*.zip' | head -n1)"
          if [ -z "$zip" ]; then
            echo "::error::No .zip found in dist-artifacts — the maker output is missing the Squirrel.Mac auto-update payload."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minerva-macos-${{ runner.arch }}
          path: dist-artifacts/*
          if-no-files-found: error

      # Tag pushes additionally publish a DRAFT release — review the assets,
      # then hit "Publish" by hand. Flip `draft: false` once the pipeline is
      # trusted (and signing has landed).
      # `prerelease` is derived from the tag rather than set by hand: a semver
      # prerelease tag (v2.0.0-alpha.1, v1.4.0-rc.2 — anything with a hyphen in
      # the version) marks the release a pre-release, a plain vX.Y.Z doesn't.
      #
      # This matters because BOTH consumers of the Releases list skip
      # pre-releases: GitHub's /releases/latest — which the website's download
      # button resolves through — and the update.electronjs.org feed. So an
      # alpha handed to a tester can't displace the stable download link or get
      # offered to installed apps. Forgetting to tick the box by hand is exactly
      # the mistake that would do both at once, so the tag decides.
      - name: Publish draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      # Always remove the throwaway keychain + staged API key, even if the build
      # failed, so signing material never lingers on a (reused) runner.
      - name: Clean up signing material
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8" || true
