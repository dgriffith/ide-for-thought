# Release pipeline for Minerva (#660).
#
# Builds the macOS distributables (DMG + ZIP) via electron-forge make and
# publishes them. Two triggers:
#   - push a `v*` tag  → build + attach to a DRAFT GitHub Release for review
#   - workflow_dispatch → build + upload artifacts only (test the make path
#     without cutting a release)
#
# This closes the two gaps from build review B-H1: the `make` path was never
# exercised by CI (a maker regression stayed invisible until release day), and
# there was no tag→downloadable-build flow.
#
# Also uploads a stable-named DMG copy (Minerva-mac-arm64.dmg, no version in the
# name) alongside the version-stamped original, so the website's download button
# can link to a URL that never changes across releases (see "Collect artifacts").
#
# Signing + notarization (#959): when the Apple secrets below are configured,
# the "Prepare macOS signing" step imports the Developer ID cert into a throwaway
# keychain and exports the App Store Connect API-key env vars, so forge.config.ts
# takes its signed + notarized + stapled path. Without the secrets (e.g. a fork)
# the build still succeeds, unsigned — forge falls back automatically.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE_P12_BASE64  — `base64 -i DeveloperIDApp.p12` (Developer ID Application cert + key)
#   APPLE_CERTIFICATE_PASSWORD    — the .p12 export password
#   APPLE_API_KEY_BASE64          — `base64 -i AuthKey_XXXXXXXXXX.p8` (App Store Connect key)
#   APPLE_API_KEY_ID              — the key's 10-char Key ID
#   APPLE_API_ISSUER              — the App Store Connect Issuer ID (UUID)

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only floor, so a job added later starts with nothing and has to ask
# (#2251). `contents: write` now sits on `build-macos` alone — it used to be
# declared here at workflow scope, equivalent with one job, and silently
# inherited by the second: a notarization-status reporter, or the Linux and
# Windows builders epic #2200/#2197 will add. Same shape bench.yml uses.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    # Creates the draft Release and uploads the DMG + ZIP to it. The only job
    # in this repo that writes anything.
    permissions:
      contents: write
    # 30 was tight even before the lint/audit pre-flight (#1638) and the
    # verify + smoke-boot gate (#1637) added a few more minutes on top of an
    # already notarization-bound budget (10-15 min alone per docs/releasing.md).
    timeout-minutes: 35
    env:
      # electron-forge package OOMs on the default heap when bundling the
      # renderer + native deps — match build:e2e (#373).
      NODE_OPTIONS: --max-old-space-size=4096
      # 'true' only when the signing cert secret is configured. `secrets` isn't
      # allowed directly in step `if:`, so we hoist the presence check to an env
      # flag the signing/cleanup steps gate on. A secretless run builds unsigned.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244) — see ci.yml's
      # lint-and-test job for why this cannot rely on the conditional install.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # node-linker=hoisted → node_modules is a self-contained flat tree (no
      # store symlinks), so caching it directly is safe. Same key as ci.yml's
      # "Cache node_modules" so the two workflows share a warm cache (#1638).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The release build otherwise trusts that whatever commit a tag points
      # at already passed CI — but a tag can point anywhere (a hotfix branch,
      # an old commit, a manually rebased ref), so assert it independently
      # rather than trusting an upstream check that may not have run against
      # this exact ref (#1638). Mirrors ci.yml's lint-and-test + audit jobs.
      # The tag is the one release input nothing else validates (#2245).
      # `release.yml` builds from it and derives the pre-release flag from it,
      # while update.electronjs.org compares the RUNNING APP'S version to the
      # published release — so `git tag -a v2.0.3` on a 2.0.2 package.json
      # produces a release that is signed, notarized, stapled, verified,
      # smoke-booted, published, and never offered to a single installed app.
      #
      # `tag-release.mjs` already refuses to create a mismatched tag, but that
      # is a local convenience a hand-rolled `git tag && git push` walks past.
      # Same reasoning as the independent lint + audit above: a tag can point
      # anywhere, so assert it here rather than trusting the laptop it came
      # from. The tag is passed as an argv, never interpolated into a shell.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-tag.mjs "$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - name: Lint (tsc + svelte-check + eslint)
        run: pnpm lint

      - name: Audit shipped dependencies (prod, high+critical)
        run: pnpm audit --prod --audit-level=high

      # Import the Developer ID cert into a throwaway keychain and stage the
      # App Store Connect API key, then export the paths/ids forge.config.ts
      # reads (APPLE_API_KEY / _KEY_ID / _ISSUER) via $GITHUB_ENV so the build
      # step below picks up the signed path. Secrets are decoded to files under
      # $RUNNER_TEMP and never echoed. Skipped (build stays unsigned) when the
      # signing secrets aren't configured.
      - name: Prepare macOS signing
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          API_KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          # Decode the secrets to files (base64 -D on macOS runners).
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"

          # Throwaway keychain holding just the Developer ID identity. Add it to
          # the search list so codesign / find-identity can see the cert.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT_PATH"

          # Hand forge the notarization creds + keychain path (for cleanup).
          {
            echo "APPLE_API_KEY=$API_KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Build distributables (electron-forge make)
        run: pnpm build

      # The signed/notarized artifact was previously never launched or
      # verified by the workflow before being drafted — signature/notarization
      # checks were a manual step in docs/releasing.md's review checklist, and
      # the only Playwright coverage ran against unsigned builds in ci.yml.
      # These two steps close that gap (#1637): assert the signature and
      # notarization ticket independently of forge's own (silent-on-success)
      # signing step, then actually boot the packaged app once before
      # anything is drafted or uploaded.
      #
      # Skipped on an unsigned build (no signing secrets configured, e.g. a
      # fork or a workflow_dispatch run without creds) — there's no signature
      # or staple to check in that case, matching how "Prepare macOS signing"
      # itself is gated. The smoke-boot step below still runs unconditionally.
      - name: Verify code signature + notarization
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APP_DIR="$(find out -maxdepth 1 -iname 'Minerva-darwin-*' -type d)"
          APP_PATH="$APP_DIR/Minerva.app"
          DMG_PATH="$(find out/make -maxdepth 1 -name '*.dmg' | head -n1)"
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No .dmg in out/make to verify — did the build step actually produce one?"
            exit 1
          fi

          echo "codesign --verify: $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "Gatekeeper assessment (app): $APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          # `spctl -a -t open --context context:primary-signature` on the DMG
          # itself was tried here (#1637) and dropped: it's a documented
          # false-negative source on Apple's own developer forums
          # ("Checking DMG notarization. Rejected, but works fine") — notarytool
          # doesn't require the disk image container to be code-signed, only
          # stapled, so this specific Gatekeeper assessment can reject a
          # genuinely valid DMG. `stapler validate` below is Apple's
          # purpose-built tool for exactly this check and is authoritative.
          echo "Notarization staple: $DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      # Reuses the existing "packaged app opens a DuckDB-backed project"
      # e2e spec (tests/e2e/smoke.spec.ts) rather than writing a second boot
      # check — it already launches the real packaged .app (picking up the
      # signed one built above), opens a real project, and fails on any
      # main-process error, which is a stronger gate than a bare launch/quit.
      - name: Smoke-boot the packaged app
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts -g "packaged app"

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find out/make -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist-artifacts/ \;

          # Stable-named copy of the DMG (#1300-adjacent: website download link),
          # alongside the version-stamped original. The versioned name changes
          # every release, so the website can't link to it directly — this fixed
          # name lets it link to a URL that never changes:
          #   .../releases/latest/download/Minerva-mac-arm64.dmg
          # which GitHub always redirects to whatever's currently published.
          dmg="$(find dist-artifacts -maxdepth 1 -name '*.dmg' | head -n1)"
          if [ -n "$dmg" ]; then
            cp "$dmg" dist-artifacts/Minerva-mac-arm64.dmg
          fi

          echo "Collected:"
          ls -la dist-artifacts

          # A DMG-only or ZIP-only release silently breaks something: the DMG
          # is the human download, the ZIP is the Squirrel.Mac auto-update
          # payload update.electronjs.org serves. Fail here, before drafting,
          # rather than have a maker regression ship quietly (#1639).
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found in dist-artifacts — the maker output is missing the human-downloadable installer."
            exit 1
          fi
          zip="$(find dist-artifacts -maxdepth 1 -name '*.zip' | head -n1)"
          if [ -z "$zip" ]; then
            echo "::error::No .zip found in dist-artifacts — the maker output is missing the Squirrel.Mac auto-update payload."
            exit 1
          fi

      # The artifacts exist; are they the size they should be? (#2243) The ZIP is
      # the auto-update payload and Squirrel has no delta mechanism, so every
      # byte is downloaded by every user on every point release — and it drifted
      # to 242 MB with nothing watching. Ratcheted against
      # build/artifact-size-budget.json, same shape as the file-size budgets.
      #
      # Deliberately here rather than in a scheduled job: this runs where a
      # human is already watching the release they just cut, which is the
      # cheapest notification path there is (#2242).
      - name: Check artifact size budgets
        run: node scripts/check-artifact-size.mjs dist-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minerva-macos-${{ runner.arch }}
          path: dist-artifacts/*
          if-no-files-found: error

      # Tag pushes additionally publish a DRAFT release — review the assets,
      # then hit "Publish" by hand. Flip `draft: false` once the pipeline is
      # trusted (and signing has landed).
      # `prerelease` is derived from the tag rather than set by hand: a semver
      # prerelease tag (v2.0.0-alpha.1, v1.4.0-rc.2 — anything with a hyphen in
      # the version) marks the release a pre-release, a plain vX.Y.Z doesn't.
      #
      # This matters because BOTH consumers of the Releases list skip
      # pre-releases: GitHub's /releases/latest — which the website's download
      # button resolves through — and the update.electronjs.org feed. So an
      # alpha handed to a tester can't displace the stable download link or get
      # offered to installed apps. Forgetting to tick the box by hand is exactly
      # the mistake that would do both at once, so the tag decides.
      - name: Publish draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist-artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      # Always remove the throwaway keychain + staged API key, even if the build
      # failed, so signing material never lingers on a (reused) runner.
      - name: Clean up signing material
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8" || true
