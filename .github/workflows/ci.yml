# CI for Minerva (#340 + #394).
#
# These jobs run in parallel, with no `needs:` edges between them:
#   - lint: tsc + svelte-check + eslint + the file checks (ubuntu)
#   - lint-and-test: plain vitest (the name predates `lint` moving out)
#   - coverage: vitest with v8 instrumentation + the per-area coverage floors
#   - audit: dependency advisories (ubuntu; reads only the lockfile)
#   - e2e: electron-forge package + Playwright Electron smoke
#   - lint-and-test-linux: lint + vitest on ubuntu-latest
#   - lint-and-test-windows: lint + vitest on windows-latest
#
# All seven are required checks in `.github/rulesets/main.json` (#2353), on
# pull requests AND on main — so the PR critical path is the slowest of them,
# not their sum.
#
# Two more are NOT required and cannot fail the run:
#   - x64-smoke: an x64 build smoke-booted on an Intel runner, on main pushes
#     (and PRs labelled `x64-smoke`) only — an early warning for #962.
#   - security scan: Electronegativity + Semgrep against a baseline (#2570).
#
# The macOS jobs run on macos-latest: it matches the dev machine and the
# shipped platform. The e2e job additionally needs a darwin Electron app
# bundle, so cross-platform e2e means separate package targets per platform
# (#2179).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything (#2251). The repository default is already
# `read` — checked, not assumed:
#
#   gh api repos/:owner/:repo/actions/permissions/workflow
#   {"default_workflow_permissions":"read", …}
#
# so this changes no behaviour today. It pins the assumption: an org- or
# repo-level settings change would otherwise silently widen the token for
# three jobs that only read, and nothing in the repo would show it.
#
# Workflow scope rather than per-job, unlike release.yml: `contents: read` is
# the value a future job should inherit, so inheritance is the feature here
# rather than the hazard. Verified sufficient for all three jobs — the only
# secret in this file is CODECOV_TOKEN (codecov's own, not GITHUB_TOKEN), and
# cache/upload-artifact talk to their own services rather than the contents
# API.
permissions:
  contents: read

# Cancel a superseded run on a PR branch — saves minutes on a busy PR. NEVER
# on main (#2352): every main commit must get a verdict. Cancelling there left
# 25 of 40 main runs with no result, so a red main (#2348) couldn't be
# bisected from CI and a release could be tagged on a SHA nobody had checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tsc, svelte-check, eslint and the two file checks — none of them depends on
  # the platform, so they run on Linux (2026-11-03): eslint's type-aware rules
  # took 2m45s on ubuntu-latest against 5-16 min on macos-latest, where they
  # used to share the 30-minute budget with the suite. A required check.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The ONLY assertion that pnpm-lock.yaml still matches package.json, and
      # it has to run unconditionally (#2244). The `--frozen-lockfile` install
      # below is conditional on a cache MISS, and the cache key hashes the
      # lockfile but not the manifest — so editing a version range in
      # package.json without regenerating the lockfile leaves the key
      # unchanged, skips the install, and reports green against dependencies
      # that do not match the manifest. (Verified skipped in run 35524773279.)
      #
      # `--lockfile-only` resolves and compares without installing or linking
      # (~0.4s), and `--frozen-lockfile` makes it fail rather than rewrite the
      # lockfile. Deliberately NOT fixed by adding package.json to the cache
      # key: that busts node_modules on every version bump and script edit,
      # and still only checks on the miss path.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # node-linker=hoisted → node_modules is a self-contained flat tree (no
      # store symlinks), so caching it directly is safe. Keyed on the lockfile
      # + Node + OS/arch, so a dep or Node bump busts it. The `cache: pnpm`
      # store cache above still speeds the miss path. Bump v1 if a runner-image
      # change ever stales the native binaries baked into the tree (#663).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc + svelte-check + eslint)
        run: pnpm lint

      - name: Lint fonts
        run: pnpm lint:fonts

      # website/docs/*.html is generated from _layout.html + _nav.json +
      # _content/*.html fragments (scripts/build-docs.mjs). `--check` diffs the
      # regenerated pages against what's committed without writing, so a
      # hand-edit to a generated page that drifts from its source fragment
      # fails here instead of only in a developer's local predev/prebuild run.
      - name: Check generated docs are up to date
        run: pnpm check:docs

  lint-and-test:
    runs-on: macos-latest
    # The plain suite only — lint is the `lint` job above (2026-11-03), the
    # instrumented run is the `coverage` job below. The name is kept because
    # it's a required check (.github/rulesets/main.json). Longest run of this shape was 731s on 2026-09-27; by 2026-10-07 the
    # suite had grown past 12,000 tests and main's runs took 8-19 min, one was
    # cancelled at the 20-minute limit, and a PR run's lint step alone took
    # 7 min on a slow runner. 30 gave a slow runner headroom again. On
    # 2026-11-03 runs climbed back to it — eslint alone took 14-16 min on
    # loaded macOS runners and two runs (one on main) were cancelled after
    # every test had passed — so, as this note said to, lint moved to its own
    # job rather than this being raised again. (It was 30 before, while this
    # job also ran `pnpm coverage` on main.)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The ONLY assertion that pnpm-lock.yaml still matches package.json, and
      # it has to run unconditionally (#2244). The `--frozen-lockfile` install
      # below is conditional on a cache MISS, and the cache key hashes the
      # lockfile but not the manifest — so editing a version range in
      # package.json without regenerating the lockfile leaves the key
      # unchanged, skips the install, and reports green against dependencies
      # that do not match the manifest. (Verified skipped in run 35524773279.)
      #
      # `--lockfile-only` resolves and compares without installing or linking
      # (~0.4s), and `--frozen-lockfile` makes it fail rather than rewrite the
      # lockfile. Deliberately NOT fixed by adding package.json to the cache
      # key: that busts node_modules on every version bump and script edit,
      # and still only checks on the miss path.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # node-linker=hoisted → node_modules is a self-contained flat tree (no
      # store symlinks), so caching it directly is safe. Keyed on the lockfile
      # + Node + OS/arch, so a dep or Node bump busts it. The `cache: pnpm`
      # store cache above still speeds the miss path. Bump v1 if a runner-image
      # change ever stales the native binaries baked into the tree (#663).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # pandas/matplotlib/pillow back three real compute-notebook rich-output
      # tests (python-kernel.test.ts: DataFrame → table, matplotlib Figure →
      # image, PIL Image → image). They're optional for a *user's* Python
      # interpreter (docs/packaging.md), but installing them here makes CI's
      # coverage of that path deterministic instead of silently skipping
      # (#2056) — the same reasoning `fetch-embedding-model.mjs`'s `pretest`
      # hook applies to the embedding model.
      # `--break-system-packages`: macos-latest's system python3 is a
      # Homebrew install, which marks itself PEP 668 "externally managed" and
      # refuses a bare `pip install`. Safe here — this VM is discarded after
      # the job, so there's no "broken Homebrew" to worry about persisting.
      - name: Install Python packages for compute rich-output tests
        run: pip3 install --quiet --break-system-packages pandas matplotlib pillow

      # Plain, uninstrumented suite on every event. The floors are enforced by
      # the parallel `coverage` job below; this one stays so a plain test
      # failure reports in the time it takes to run, without waiting on the
      # instrumentation slowdown.
      - name: Test
        run: pnpm test

  # The same lint and suite on Linux (#2178, epic #2200). A required check
  # since 2026-11-03, after passing on every run since it was added, so it is
  # NOT `continue-on-error`: a Linux failure turns the run red, and
  # release.yml's gate reads the whole run.
  #
  # What Linux found, both fixed in the PR that added this: the palette
  # snapshot read the host's platform (⌘ vs Ctrl), and two caches trusted a
  # file's stat stamp within one coarse timestamp tick (shared/file-stamp.ts).
  # Lint fonts and the generated-docs check stay on lint-and-test: they test
  # files, not the platform.
  lint-and-test-linux:
    name: lint-and-test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as the other jobs (lockfile-gate.test.ts holds them
      # byte-identical); `runner.os` in it gives Linux its own entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc + svelte-check + eslint)
        run: pnpm lint

      # As on lint-and-test (#2056). Ubuntu's system Python is PEP 668
      # "externally managed" too; this VM is discarded after the job.
      - name: Install Python packages for compute rich-output tests
        run: pip3 install --quiet --break-system-packages pandas matplotlib pillow

      - name: Test
        run: pnpm test

  # The same lint and suite on Windows (#2180, epic #2200). A required check
  # since 2026-11-03, once the suite passed there (#2989, #2990, #2979, #2980
  # and friends), so it is NOT `continue-on-error`: a Windows failure turns the
  # run red, and release.yml's gate reads the whole run. The repo's
  # .gitattributes keeps the checkout LF, as the fixtures expect.
  #
  # Steps run in bash (Git Bash, on every Windows runner), not the default
  # PowerShell. Under pwsh, the bare `pnpm` the setup action puts on PATH
  # resolved to a shim that ran nothing and exited 0: the first run "passed"
  # install, lint and 14,000 tests in four seconds with no output at all. The
  # pnpm-version step and the test step's summary check exist so an empty run
  # can't read as green again.
  lint-and-test-windows:
    name: lint-and-test on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A pnpm that runs nothing must fail here, not pass every step after.
      - name: Check pnpm runs
        run: |
          v="$(pnpm --version)"
          echo "pnpm $v"
          [ -n "$v" ] || { echo "::error::pnpm printed no version: it isn't running"; exit 1; }

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as the other jobs (lockfile-gate.test.ts holds them
      # byte-identical); `runner.os` in it gives Windows its own entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc + svelte-check + eslint)
        run: pnpm lint

      # As on lint-and-test (#2056). Windows' Python isn't PEP 668-managed.
      - name: Install Python packages for compute rich-output tests
        run: python -m pip install --quiet pandas matplotlib pillow

      # `set -o pipefail` so tee doesn't hide vitest's exit code (as bench.yml
      # learned, #2242), and the summary check so a run that tested nothing
      # fails rather than passing.
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest.log
          grep -Eq "Test Files .*passed" vitest.log || { echo "::error::no test summary: the suite didn't run"; exit 1; }

  # The coverage floors, on pull requests AND on main (#2359 → reversed here).
  #
  # `pnpm coverage` runs the full suite with v8 instrumentation and enforces the
  # per-area thresholds in vitest.config — so the trust + security paths can't
  # silently regress (#679). The citeproc publish suites carry per-test
  # timeouts (#677) that absorb the instrumentation slowdown.
  #
  # History, kept because the trade-off was reasonable and is now gone: #2359
  # moved `pnpm coverage` to main-only pushes, because as a STEP inside
  # lint-and-test it was ~71% of the PR critical path (686s by 2026-09-27), and
  # a floor breach surfacing post-merge looked acceptable since main runs are
  # never cancelled (#2352). It was not acceptable in practice: #2432 merged
  # green, dropped `src/main/project-context.ts` branch coverage under its 90%
  # floor, and left main's lint-and-test red for three commits. A red main is
  # not a cosmetic cost — release.yml refuses to release a SHA whose main CI
  # run wasn't a success (#2371), so a post-merge verdict blocks shipping for
  # everyone until someone lands a fix.
  #
  # What changed the answer: this repo is public, so Actions minutes are free
  # and the constraint was only ever wall clock. As its OWN job, running
  # alongside lint-and-test rather than after lint inside it, coverage costs
  # one extra runner and roughly nothing on the critical path — the PR waits
  # for max(lint-and-test, coverage), not their sum. It is a required check,
  # so a floor breach now blocks the merge that causes it.
  # `coverage-floor-enrollment.test.ts` pins that this job runs on
  # pull_request as well as on push; losing either leaves the floors
  # unenforced somewhere, silently and green.
  #
  # Sharding was considered and deferred (#2248) — vitest's `--mergeReports`
  # merges test results but NOT coverage, so it would mean re-implementing this
  # repo's per-glob threshold map outside vitest. The measurement, the
  # verification, and the revisit trigger are recorded at the top of
  # `vitest.config.mts`'s `test:` block; read that before optimising this job.
  #
  # Setup mirrors lint-and-test step for step — the suite is the same suite,
  # only instrumented. The embedding model arrives via the `precoverage` hook
  # (scripts/fetch-embedding-model.mjs), and no step here builds the help-docs
  # corpus because no unit test reads the built corpus (the e2e job's cache
  # step is for the packaged app).
  coverage:
    runs-on: macos-latest
    # `pnpm coverage` alone was 603-686s on main in late 2026-09; 30 leaves room
    # for the ~35%-in-3-weeks growth #2359 measured.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test for
      # why this cannot rely on the conditional install below.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as lint-and-test and e2e so all three share the cached tree
      # (#663); lockfile-gate.test.ts holds the keys byte-identical.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Same reasoning as lint-and-test (#2056): python-kernel.test.ts
      # hard-asserts these under CI rather than skipping, so the instrumented
      # run needs them exactly as the plain one does.
      - name: Install Python packages for compute rich-output tests
        run: pip3 install --quiet --break-system-packages pandas matplotlib pillow

      - name: Test + coverage
        run: pnpm coverage

      # Trend + per-PR coverage-delta visibility (#1096 / QA H4); tuned by
      # `codecov.yml`. The floors above (pnpm coverage) remain the hard gate —
      # Codecov is informational and never blocks a PR (fail_ci_if_error: false).
      # Non-fatal so CI isn't blocked before the repo is enrolled / CODECOV_TOKEN
      # is set; the upload + PR comment activate automatically once it is.
      # (Fork PRs get no secrets, so their upload is a silent no-op too.)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Supply-chain / CVE scanning (#1095 / QA H3). Paired with .github/dependabot.yml:
  # Dependabot opens update PRs, this step makes the current advisory state
  # visible on every PR/push. Lightweight + decoupled — audit reads only the
  # lockfile, so no node_modules install, no native binaries, ubuntu is fine.
  #
  # `audit:prod` (shipped surface) is now BLOCKING (#1455). The 8 high + 2
  # critical shipped advisories from the 2026-07-27 baseline were all in
  # transitive tooling unreachable at runtime — rdflib's git-URL resolver
  # (parse-url SSRF ×2, tmp, gry) and @huggingface/transformers' native/image
  # deps (sharp, adm-zip via onnxruntime-node, which our WASM-only voice +
  # embeddings paths never load) — and were force-patched via `overrides:` in
  # `pnpm-workspace.yaml`
  # (parse-url ≥8.1, tmp ≥0.2.6, gry ≥6, sharp ≥0.35, adm-zip ≥0.6). No
  # `--ignore` allowlist was needed; the overrides resolved cleanly and graph/
  # SPARQL/voice were verified (pnpm lint + test + e2e).
  #
  # `audit:all` (full tree incl. build/dev tooling) is BLOCKING as of #2249,
  # ratcheted against `build/audit-baseline.json` rather than against zero.
  # STEP 2 of the promotion path, in the only form it can take: the one
  # remaining high advisory is in `image-size` (the two unpatchable
  # `extract-zip` ones left with Electron Forge 8): patched at >=2.0.3 (but
  # reached via `appdmg@0.6.6` which declares `^0.7.4` and calls
  # `require('image-size')(path, cb)`; 2.x is ESM-first, exports
  # `{ imageSize }` taking a Buffer, and has no callback form — forcing the
  # override and reproducing appdmg's call gives `sizeOf is not a function`,
  # i.e. it breaks the DMG build, the same shape as the plist>@xmldom/xmldom
  # entry in pnpm-workspace.yaml, and with no safe floor since 1.x is
  # vulnerable too). None reaches a user. Re-bless with
  # `node scripts/check-audit.mjs --update` when the set genuinely changes.
  #
  # Remediation levers: bump via the Dependabot PRs; force a patched transitive
  # with an entry under `overrides:` in `pnpm-workspace.yaml`; allowlist an
  # accepted/unfixable advisory with `--ignore <CVE>` (append to the commands
  # below with a comment naming the advisory and why it's accepted).
  #
  # `pnpm-workspace.yaml`, NOT package.json's `pnpm` key (#2260). This line said
  # package.json until pnpm 11/12 stopped reading settings from there (#2149) —
  # and pnpm does not error on an unused `pnpm` key, it silently ignores it. So
  # following the old instruction during a real advisory response produced an
  # edit that looked applied and an advisory that stayed open. Note the
  # `image-size` paragraph above already cites the right file; only this
  # instruction was left behind.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shipped surface — the advisories that actually reach users. BLOCKING
      # (#1455): a new high/critical on a --prod dependency fails CI.
      - name: audit:prod (shipped deps, high+critical)
        run: pnpm audit --prod --audit-level=high

      # Full tree incl. build/dev tooling. BLOCKING as of #2249, but against a
      # committed baseline rather than zero — step 2 of the promotion path,
      # taken in the only form available.
      #
      # `continue-on-error: true` made this step green whether the tree got
      # better or worse, so the comment above describing "once the full tree is
      # clean" had no way to ever tell anyone that moment had arrived. The tree
      # is not clean and cannot currently be made clean (see
      # build/audit-baseline.json for the per-advisory reasons) — but "no worse
      # than today" is enforceable, which is the same shape as the pattern
      # ratchets, file-size budgets and coverage floors.
      - name: audit:all (full tree, ratcheted against the baseline)
        run: node scripts/check-audit.mjs

  # Advisory static security scanners (#2570): Electronegativity (Electron
  # misconfiguration checks) and Semgrep (registry packs plus the custom rules
  # in .semgrep/minerva.yml), each compared against
  # build/security-scan-baseline.json by scripts/security-scan-report.mjs. A
  # new finding is a ::warning annotation and a job-summary row, never a red
  # run. Job-level continue-on-error keeps it out of the merge gate (#2387's
  # rule for an unrequired job). Promote it to required once the baseline has
  # settled. Both tools are version-pinned and fetched at run time, so they
  # stay out of the lockfile and the audit baseline.
  security-scan:
    name: security scan (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Electronegativity
        # -e: our Electron, which it can't detect when pointed at src/.
        run: |
          pnpm dlx @doyensec/electronegativity@1.10.3 -i "$PWD/src" -r -v false \
            -e "$(node -p "require('./package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")" \
            -o electronegativity.csv || true

      - name: Semgrep rule tests
        # The custom rules must still fire on their positive cases.
        run: pipx run --spec semgrep==1.179.0 semgrep --test --metrics=off --config .semgrep/minerva.yml .semgrep/minerva.ts

      - name: Semgrep
        run: |
          pipx run --spec semgrep==1.179.0 semgrep scan --metrics=off \
            --config p/electron-desktop-app --config p/typescript --config r/javascript.electron \
            --config .semgrep/minerva.yml src/main --json -o semgrep.json || true

      - name: Compare with the baseline
        run: node scripts/security-scan-report.mjs electronegativity.csv semgrep.json

  e2e:
    # Runs in parallel with lint-and-test and coverage. Stays out of the unit loop
    # because Electron boot is 5–10s and the watcher loop should stay
    # snappy.
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244) — see ci.yml's
      # lint-and-test job for why this cannot rely on the conditional install.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # See lint-and-test for the rationale; same key so all three macOS jobs
      # share the cached tree across runs (#663).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The help-docs corpus is a pure function of committed inputs — the 119
      # docs fragments, the extraction logic, this script, and the pinned model
      # — but `resources/help-docs/` is gitignored, so every runner rebuilt it
      # from scratch: 46s, more than `electron-forge package` (12s) and
      # Playwright (41s) combined, and 46% of this job's real work (#2246).
      #
      # The key hashes exactly what `build-help-corpus.mjs`'s own freshness
      # check hashes, so a cache miss and a rebuild coincide. `src/main/
      # embeddings/**` is in the key because the corpus is embedded with the
      # model the app ships — changing the embedder changes the vectors.
      #
      # NOTE: caching this only works because that check is a CONTENT HASH.
      # It used to compare mtimes, and `actions/checkout` stamps every source
      # file with the checkout time while a restored cache keeps its older
      # one — so the corpus would have been restored and then rebuilt anyway,
      # reporting a cache hit and saving nothing. Measured before changing it.
      - name: Cache help-docs corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/help-docs
          key: >-
            help-corpus-v1-${{ hashFiles('website/docs/_content/**',
            'scripts/build-help-corpus.mjs', 'scripts/lib/extract-docs-corpus.mjs',
            'scripts/lib/docs-model.mjs', 'src/main/embeddings/**') }}

      - name: E2E (electron-forge package + Playwright)
        # `test:e2e` builds the app via electron-forge package, then
        # runs Playwright against the in-tree .vite/build/main.js
        # entry. Single test today (#394 smoke); add cases per
        # "the app stopped working entirely" incident.
        run: pnpm test:e2e

      # Read the Electron fuses back off the app `test:e2e` just packaged
      # (#2366). forge.config.ts asking for them proves nothing about the
      # binary, and a fuse that silently didn't flip fails nothing else — the
      # packaged specs pass either way. Also fails when an Electron upgrade
      # adds a fuse scripts/lib/electron-fuses.mjs doesn't decide.
      - name: Check Electron fuses on the packaged app
        run: node scripts/check-electron-fuses.mjs

      # Flake report + budget (#1946, #2379). Playwright retries a test twice
      # in CI so one transient Electron-boot hiccup doesn't fail the job
      # (#1097); this step tables every retry and FAILS THE JOB when more than
      # one test in the run needed one. The budget (1) and the measurement
      # behind it live in scripts/lib/e2e-flake-budget.mjs, not here and not
      # as a Playwright flag. `if: always()` so the table and the verdict are
      # recorded even when the Playwright step already failed.
      #
      # What fails the e2e job, exactly:
      #   - the Playwright step: a test that failed every attempt, OR an error
      #     outside any test (e.g. "Worker teardown timeout" — the app under
      #     test never quit). Retries cannot absorb either, and a single flake
      #     can sit next to one: PR #2455's first run showed "1 flaky" and a
      #     red job, and the cause was the teardown timeout, not the flake.
      #     This step's verdict now says which it was.
      #   - this step: flaky tests > 1 ("flake budget exceeded: 2 flaky > 1",
      #     listing them, also as an ::error annotation).
      #
      # Don't `gh run rerun --failed` a flaky e2e job to green without naming
      # the test that flaked (in the PR, or an issue): a rerun replaces the
      # attempt people look at, and the flake drops out of the record — which
      # is how 34 flakes in 59 runs read as "0 flakes in 8+ runs" (#2379).
      - name: E2E flake report
        if: always()
        run: node scripts/e2e-flake-report.mjs playwright-report.json

      # Time-to-first-paint of the packaged app (#2384), from the packaged
      # smoke spec that ran above. A trend, not a gate: into the job summary
      # and a `::notice`, always exit 0. Here as well as in release.yml because
      # releases are rare and every main push packages the app anyway — this
      # is the path that makes it a trend. The raw samples ride along in the
      # test-results/ upload below (first-paint.jsonl).
      - name: First-paint time (packaged app)
        if: always()
        run: node scripts/first-paint-report.mjs test-results/first-paint.jsonl --label "ci e2e, ${{ runner.os }} ${{ runner.arch }}"

      # The JSON report, plus test-results/: the trace of each test's first
      # failing attempt (runner trace + the Electron renderer's own trace,
      # `electron-trace`) and its error context (#2458). A green run retains no
      # traces — `retain-on-first-failure` discards them — so this costs bytes
      # only when something failed. Open one with `npx playwright show-trace`.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report.json
            test-results/
          retention-days: 30

  # The e2e suite on Linux (#2179, epic #2200), under Xvfb, against the in-tree
  # build exactly as the macOS job runs it. Advisory until it has run green
  # for a while: `continue-on-error` keeps the RUN's conclusion green, which
  # release.yml's main-CI gate (#2371) reads, and branch-ruleset.test.ts
  # requires of any job not in the ruleset. Promote it the way
  # lint-and-test-linux was (#2978 → #3001).
  #
  # `test:e2e` packages the app first, so the packaged-app specs (smoke's
  # packaged boot and DuckDB project, embeddings, cli-packaged,
  # cli-plugin-check-code) run against the Linux package too (#2185, #2981):
  # `out/Minerva-linux-x64/minerva`, laid out per scripts/lib/packaged-app.mjs.
  # Then the same fuse read-back and first-paint trend as the macOS job.
  e2e-linux:
    name: e2e on Linux (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as the other jobs (lockfile-gate.test.ts holds them
      # byte-identical); a hit shares lint-and-test-linux's entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The e2e job's exact key: the corpus is data, so a hit shares its entry.
      # See there for why the rebuild check is a content hash.
      - name: Cache help-docs corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/help-docs
          key: >-
            help-corpus-v1-${{ hashFiles('website/docs/_content/**',
            'scripts/build-help-corpus.mjs', 'scripts/lib/extract-docs-corpus.mjs',
            'scripts/lib/docs-model.mjs', 'src/main/embeddings/**') }}

      # Ubuntu 24.04 lets AppArmor refuse unprivileged user namespaces, which
      # is the sandbox Chromium uses when its SUID helper (node_modules'
      # chrome-sandbox, not root-owned) isn't set up — so Electron aborts at
      # launch. Lift the restriction for this throwaway VM rather than run the
      # app under test with `--no-sandbox`, which a user's install never does.
      - name: Allow Chromium's user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A virtual display: the runner has none, and Electron needs one even
      # for windows nobody sees.
      - name: E2E (electron-forge package + Playwright, under Xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e

      # Linux's fuse values differ from macOS's in one place: no asar
      # integrity, which Electron doesn't check on Linux (#2981). The checker
      # reads the binary against this platform's policy.
      - name: Check Electron fuses on the packaged app
        run: node scripts/check-electron-fuses.mjs

      # DuckDB's binding links a shared library by rpath, which the OS loader
      # can't open from inside app.asar (#2185). The smoke spec's DuckDB
      # project fails if it's missing; this names the file instead.
      - name: DuckDB's native library is unpacked from the asar
        run: |
          set -euo pipefail
          UNPACKED="out/Minerva-linux-x64/resources/app.asar.unpacked"
          find "$UNPACKED" -name '*.node' -o -name '*.so' | sed "s|^$UNPACKED/||"
          find "$UNPACKED" -name 'libduckdb.so' | grep -q . \
            || { echo "::error::no libduckdb.so under $UNPACKED — the asar unpack glob in forge.config.ts misses it"; exit 1; }

      # The Linux makers (#2182), on every PR rather than only on release day —
      # the B-H1 gap release.yml was written to close, where a maker regression
      # stayed invisible until a tag. `--from-package` reuses the app the step
      # above packaged, so it costs the makers' time only.
      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Make the .deb and .rpm from the packaged app
        run: pnpm exec electron-forge make --from-package

      # Installed the way a user would, then used: `minerva sql` opens DuckDB
      # from /usr/lib/minerva, so the binding, its unpacked .so (#2185) and the
      # /usr/bin symlink the package writes are all exercised for real.
      - name: Install the .deb and run its CLI
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ./out/make/deb/x64/*.deb
          command -v minerva
          tb="$(mktemp -d)"
          printf '# Hello\n' > "$tb/hello.md"
          out="$(xvfb-run --auto-servernum minerva --minerva-cli -- sql 'SELECT 6 * 7 AS answer' --project "$tb")"
          echo "$out"
          grep -q 42 <<<"$out" || { echo "::error::the installed minerva didn't answer a SQL query"; exit 1; }

      # Sizes, against build/artifact-size-budget.json once the Linux packages
      # have budgets; until then each is printed and passes.
      - name: Linux package sizes
        run: node scripts/check-artifact-size.mjs out/make

      # The same report and budget as the macOS job. While the job is
      # advisory, a breach shows here and in the job's own red X, not the run.
      - name: E2E flake report
        if: always()
        run: node scripts/e2e-flake-report.mjs playwright-report.json

      # As on the macOS job: a trend, never a gate (#2384).
      - name: First-paint time (packaged app)
        if: always()
        run: node scripts/first-paint-report.mjs test-results/first-paint.jsonl --label "ci e2e, ${{ runner.os }} ${{ runner.arch }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-linux
          path: |
            playwright-report.json
            test-results/
          retention-days: 30

  # The Windows package (#2181, epic #2200): built, fuse-checked, smoke-booted,
  # made into its Squirrel installer, installed the way a user would, used,
  # and uninstalled, on every PR, so a Windows packaging regression shows here
  # and not on release day. Advisory while it settles, like e2e-linux:
  # `continue-on-error` keeps the run green for release.yml's gate (#2371),
  # and branch-ruleset.test.ts lists it as not required.
  #
  # Not the e2e suite on Windows; that's its own step (#2179's sibling). This
  # is what a Windows release depends on: the package boots and installs.
  package-windows:
    name: Windows package (advisory)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      # build:e2e's `NODE_OPTIONS=… electron-forge package` prefix is POSIX
      # shell; the steps below run its two halves with the heap set here.
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # As lint-and-test-windows: a pnpm that runs nothing must fail here.
      - name: Check pnpm runs
        run: |
          v="$(pnpm --version)"
          echo "pnpm $v"
          [ -n "$v" ] || { echo "::error::pnpm printed no version: it isn't running"; exit 1; }

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as the other jobs (lockfile-gate.test.ts holds them
      # byte-identical); a hit shares lint-and-test-windows's entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The e2e job's exact key: the corpus is data, so a hit shares its entry.
      - name: Cache help-docs corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/help-docs
          key: >-
            help-corpus-v1-${{ hashFiles('website/docs/_content/**',
            'scripts/build-help-corpus.mjs', 'scripts/lib/extract-docs-corpus.mjs',
            'scripts/lib/docs-model.mjs', 'src/main/embeddings/**') }}

      - name: Package the app (unsigned)
        run: |
          node scripts/prep.mjs
          pnpm exec electron-forge package

      # Windows keeps asar integrity ON (#2981): packager writes the archive's
      # hash into the exe as a resource. A wrong value fails here by name; a
      # missing resource fails the boot below.
      - name: Check Electron fuses on the packaged app
        run: node scripts/check-electron-fuses.mjs

      # duckdb.dll is opened by the OS loader, not from inside app.asar (#2185).
      - name: DuckDB's native library is unpacked from the asar
        run: |
          set -euo pipefail
          UNPACKED="out/Minerva-win32-x64/resources/app.asar.unpacked"
          find "$UNPACKED" -name '*.node' -o -name '*.dll' | sed "s|^$UNPACKED/||"
          find "$UNPACKED" -name 'duckdb.dll' | grep -q . \
            || { echo "::error::no duckdb.dll under $UNPACKED — the asar unpack glob in forge.config.ts misses it"; exit 1; }

      # Minerva.exe, booted on a DuckDB-backed project — release's smoke boot.
      - name: Smoke-boot the packaged app
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts -g "packaged app"

      - name: Make the Squirrel installer from the packaged app
        run: pnpm exec electron-forge make --from-package

      # The installer's whole life, as a user meets it. Setup.exe installs
      # per-user into %LOCALAPPDATA%\minerva and runs the app's
      # --squirrel-install hook (squirrel-events.ts), which makes the Start
      # menu shortcut; then the installed CLI answers a query, opening
      # duckdb.dll from the install; then uninstall runs --squirrel-uninstall,
      # which removes the shortcut again.
      - name: Install, use and uninstall
        run: |
          set -euo pipefail
          setup="$(find out/make/squirrel.windows -name '*Setup.exe' | head -n1)"
          [ -n "$setup" ] || { echo "::error::no Setup.exe in out/make/squirrel.windows"; exit 1; }
          "$setup" --silent
          # Setup launches the app once installed; it's not wanted here.
          sleep 5
          taskkill //IM Minerva.exe //F //T || true
          local_app="$(cygpath -u "$LOCALAPPDATA")/minerva"
          programs="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs"
          ls "$local_app"
          exe="$(find "$local_app" -path '*/app-*/Minerva.exe' | head -n1)"
          [ -n "$exe" ] || { echo "::error::no app-*/Minerva.exe under $local_app"; exit 1; }
          find "$programs" -name 'Minerva.lnk' | grep -q . \
            || { echo "::error::the install hook made no Start menu shortcut"; exit 1; }
          tb="$(mktemp -d)"
          printf '# Hello\n' > "$tb/hello.md"
          out="$("$exe" --minerva-cli -- sql 'SELECT 6 * 7 AS answer' --project "$(cygpath -w "$tb")")"
          echo "$out"
          grep -q 42 <<<"$out" || { echo "::error::the installed Minerva didn't answer a SQL query"; exit 1; }
          "$local_app/Update.exe" --uninstall -s
          sleep 5
          if find "$programs" -name 'Minerva.lnk' | grep -q .; then
            echo "::error::uninstall left the Start menu shortcut behind"; exit 1
          fi

      # Sizes, against build/artifact-size-budget.json once the Windows
      # artifacts have budgets; until then each is printed and passes.
      - name: Windows artifact sizes
        run: node scripts/check-artifact-size.mjs out/make

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-windows-package
          path: |
            playwright-report.json
            test-results/
          retention-days: 30

  # The e2e suite on Windows (#3023, epic #2200): the sibling of e2e-linux.
  # Advisory until it has run green for a while: `continue-on-error` keeps the
  # run green for release.yml's gate (#2371), and branch-ruleset.test.ts lists
  # it as not required. Windows runners have a desktop session, so no Xvfb.
  e2e-windows:
    name: e2e on Windows (advisory)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 50
    env:
      # test:e2e's build:e2e uses a POSIX `NODE_OPTIONS=…` prefix; the steps
      # below run prep, package and Playwright with the heap set here.
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # As lint-and-test-windows: a pnpm that runs nothing must fail here.
      - name: Check pnpm runs
        run: |
          v="$(pnpm --version)"
          echo "pnpm $v"
          [ -n "$v" ] || { echo "::error::pnpm printed no version: it isn't running"; exit 1; }

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as the other jobs (lockfile-gate.test.ts holds them
      # byte-identical); a hit shares lint-and-test-windows's entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The e2e job's exact key: the corpus is data, so a hit shares its entry.
      - name: Cache help-docs corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/help-docs
          key: >-
            help-corpus-v1-${{ hashFiles('website/docs/_content/**',
            'scripts/build-help-corpus.mjs', 'scripts/lib/extract-docs-corpus.mjs',
            'scripts/lib/docs-model.mjs', 'src/main/embeddings/**') }}

      - name: E2E (electron-forge package + Playwright)
        run: |
          node scripts/prep.mjs
          pnpm exec electron-forge package
          pnpm exec playwright test

      # The same report and budget as the other e2e jobs.
      - name: E2E flake report
        if: always()
        run: node scripts/e2e-flake-report.mjs playwright-report.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-windows
          path: |
            playwright-report.json
            test-results/
          retention-days: 30

  # Early warning for an x64 (Intel) macOS build — #2387, ahead of #962.
  #
  # NON-BLOCKING, and not in .github/rulesets/main.json. Minerva ships arm64
  # only today; this job exists so that when #962 is picked up, "does an x64
  # build even boot?" already has a history of answers, and the commit that
  # first broke it is identifiable.
  #
  # Why an x64 build on an Intel runner, not the issue's "arm64 build under
  # Rosetta on macos-13": Rosetta 2 translates x86_64 code to run on Apple
  # silicon — there is no translation the other way, so an arm64 binary cannot
  # run on an Intel Mac at all. And the `macos-13` image was retired (Dec
  # 2025). `macos-15-intel` is GitHub's current — and announced last — x86_64
  # macOS image, supported until August 2027, which is also the horizon for
  # any x64 support we'd verify in CI.
  #
  # What it does: a native x64 install (so the platform-specific optional deps
  # resolve to their darwin-x64 builds — `@duckdb/node-bindings-darwin-x64`
  # above all; embeddings/voice are WASM), an UNSIGNED `pnpm build:e2e` (plain
  # electron-forge package; signing is opt-in and never set here), a check
  # that every native binary in the bundle really is x86_64, the fuse
  # read-back, and the same packaged smoke boot release.yml runs (it opens a
  # DuckDB-backed project, so a missing or wrong-arch binding fails it).
  #
  # When it runs: pushes to main, plus any PR labelled `x64-smoke` (a PR
  # touching packaging or native deps). Not on every PR: macOS runners are the
  # scarce resource (the free plan's concurrent-macOS limit is 5, and every PR
  # already takes three), and an Intel queue wait per push buys nothing a
  # per-main-commit signal doesn't. Not a scheduled workflow: a per-commit
  # result names the commit that broke it, and a push-triggered job needs no
  # separate failure-notification path (#2242) — its red X sits on that main
  # commit in the history. Job-level `continue-on-error` keeps the RUN's
  # conclusion green, so release.yml's main-CI gate (#2371) is unaffected.
  x64-smoke:
    name: x64 smoke boot (non-blocking)
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'x64-smoke')
    runs-on: macos-15-intel
    continue-on-error: true
    # Not yet measured; Intel runners are slower than the arm64 ones and this
    # one installs cold the first time (its node_modules cache is per-arch).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244) — see lint-and-test.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Same key as the other jobs (lockfile-gate.test.ts holds them
      # byte-identical); `runner.arch` in it gives x64 its own entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # The corpus is data, not code, so this is the e2e job's exact key and a
      # hit shares its entry. See there for why the rebuild check is a content
      # hash and must stay one.
      - name: Cache help-docs corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/help-docs
          key: >-
            help-corpus-v1-${{ hashFiles('website/docs/_content/**',
            'scripts/build-help-corpus.mjs', 'scripts/lib/extract-docs-corpus.mjs',
            'scripts/lib/docs-model.mjs', 'src/main/embeddings/**') }}

      # Unsigned by construction: signing is opt-in by a flag only release.yml's
      # signed step sets (release-signing-flag.test.ts). forge packages for the host
      # arch, so this produces out/Minerva-darwin-x64.
      - name: Package the x64 app (unsigned)
        run: pnpm build:e2e

      # Would an Intel Mac load every native piece? `lipo -archs` on the app's
      # executables and each unpacked .node/.dylib: anything without x86_64 (an
      # arm64-only binding copied in by mistake) fails here, by name, rather
      # than as a boot symptom.
      - name: Every native binary in the bundle is x86_64
        run: |
          set -euo pipefail
          APP="out/Minerva-darwin-x64/Minerva.app"
          test -d "$APP" || { echo "::error::no $APP — did forge package for x64?"; ls out; exit 1; }
          bad=0
          n=0
          while IFS= read -r -d '' f; do
            archs="$(lipo -archs "$f")"
            n=$((n + 1))
            echo "$archs  ${f#"$APP/"}"
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::not x86_64: $f ($archs)"; bad=1 ;; esac
          done < <(find "$APP/Contents/MacOS" "$APP/Contents/Resources/app.asar.unpacked" \
                     -type f \( -path '*/Contents/MacOS/*' -o -name '*.node' -o -name '*.dylib' \) -print0)
          if [ "$n" -lt 2 ]; then echo "::error::found only $n native binaries — the scan is broken"; exit 1; fi
          exit "$bad"

      - name: Check Electron fuses on the packaged app
        run: node scripts/check-electron-fuses.mjs

      # The same smoke boot release.yml runs on the signed arm64 build.
      - name: Smoke-boot the packaged app
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts -g "packaged app"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x64-smoke-report
          path: |
            playwright-report.json
            test-results/
          retention-days: 30
