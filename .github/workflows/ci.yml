# CI for Minerva (#340 + #394).
#
# Two jobs run in parallel:
#   - lint-and-test: tsc + svelte-check + eslint + vitest (with coverage floors)
#   - e2e: electron-forge package + Playwright Electron smoke
#
# Both on macos-latest: matches the dev machine, and the chokidar
# watcher tests (#345) exercise macOS fsevents semantics — a Linux
# runner would need different timing tolerances. The e2e job
# additionally needs a darwin Electron app bundle, so cross-platform
# would mean separate package targets per platform.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a new commit lands on the same branch — saves
# minutes on a busy PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Match the local dev version. Bump together with the dev's pnpm.
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # node-linker=hoisted → node_modules is a self-contained flat tree (no
      # store symlinks), so caching it directly is safe. Keyed on the lockfile
      # + Node + OS/arch, so a dep or Node bump busts it. The `cache: pnpm`
      # store cache above still speeds the miss path. Bump v1 if a runner-image
      # change ever stales the native binaries baked into the tree (#663).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc + svelte-check + eslint)
        run: pnpm lint

      # `pnpm coverage` runs the full suite with v8 instrumentation and enforces
      # the per-area thresholds in vitest.config (src/shared, src/main/llm,
      # src/main/notebase) — so the trust + security paths can't silently
      # regress (#679). The citeproc publish suites carry per-test timeouts
      # (#677) that absorb the instrumentation slowdown.
      - name: Test + coverage
        run: pnpm coverage

      # Trend-tracking only — the floors above are the gate. Non-fatal so CI
      # isn't blocked before the repo is enrolled on Codecov / CODECOV_TOKEN is
      # set; activates automatically once it is.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Supply-chain / CVE scanning (#1095 / QA H3). Paired with .github/dependabot.yml:
  # Dependabot opens update PRs, this step makes the current advisory state
  # visible on every PR/push. Lightweight + decoupled — audit reads only the
  # lockfile, so no node_modules install, no native binaries, ubuntu is fine.
  #
  # NON-BLOCKING FOR NOW (continue-on-error). Baseline at add-time (2026-07-27):
  # 38 high + 3 critical total, but only 8 high + 2 critical on the *shipped*
  # (`--prod`) surface — the rest live in build/dev tooling (@electron-forge/cli,
  # eslint, vite) that never reaches users.
  #
  # PROMOTION PATH to a gating check (do this as the tree is remediated):
  #   1. Clear the shipped surface, then flip the `audit:prod` step below to
  #      blocking by removing its `continue-on-error` (gates `--prod` only —
  #      protects users first without being held hostage by build-tool CVEs).
  #   2. Once the full tree is clean, remove `continue-on-error` from `audit:all`
  #      too, or drop `audit:prod` and gate `audit:all`.
  # Remediation levers: bump via the Dependabot PRs; force a patched transitive
  # with a `pnpm.overrides` entry in package.json; allowlist an accepted/unfixable
  # advisory with `--ignore <CVE>` (append to the commands below with a comment
  # naming the advisory and why it's accepted).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Shipped surface — the advisories that actually reach users. This is the
      # first step slated to become blocking (see PROMOTION PATH above).
      - name: audit:prod (shipped deps, high+critical)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      # Full tree incl. build/dev tooling — visibility only until the whole
      # tree is clean.
      - name: audit:all (full tree, high+critical)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  e2e:
    # Runs in parallel with lint-and-test. Stays out of the unit loop
    # because Electron boot is 5–10s and the watcher loop should stay
    # snappy.
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # See lint-and-test for the rationale; same key so both jobs share the
      # cached tree across runs (#663).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: E2E (electron-forge package + Playwright)
        # `test:e2e` builds the app via electron-forge package, then
        # runs Playwright against the in-tree .vite/build/main.js
        # entry. Single test today (#394 smoke); add cases per
        # "the app stopped working entirely" incident.
        run: pnpm test:e2e
