# Performance benchmarks + regression gate (#1004, #1099).
#
# Runs the `*.bench.ts` suite — graph index/query latency, save-pipeline, and
# embedding throughput — to make scale regressions visible as a knowledge base
# grows, and gates on a committed baseline so a regression FAILS the job instead
# of sitting in a log nobody reads (finding H2).
#
# Deliberately NOT on `pull_request` / `push`: micro-benchmarks are noisy on
# shared CI runners, so gating a PR on them would flap. The gate lives here on
# the manual/scheduled runs (baseline-diff with a tolerance envelope), which is
# resistant to that noise. macos-latest matches ci.yml and the dev machine the
# baseline is blessed on.
#
# Re-blessing the baseline: dispatch this workflow with `update_baseline: true`.
# It runs the benches, writes the new baseline, and uploads it as an artifact —
# download `bench-baseline` and commit `tests/main/bench-baseline.json`.
#
# WHEN THE GATE FIRES, IT FILES AN ISSUE (#2242). It has to: this is the only
# check in the repo that runs outside the PR loop. Every other detector —
# coverage floors, file-size budgets, pattern ratchets, the architecture tests —
# runs inside `pnpm test` and so fails a PR in front of a human. This one exits
# non-zero into a scheduled run nobody opens, and it did exactly that for seven
# consecutive Mondays (2026-08-03 → 2026-09-14) while a real 3-3.8x save-path
# regression shipped. GitHub's only built-in signal for a failing scheduled
# workflow is an email to the workflow file's last committer, which is trivially
# filtered.
#
# The rule this encodes: **a check that runs out-of-band ships its notification
# path in the same PR**, or it is not a check, it is a log.
name: Bench

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Refresh the committed baseline instead of gating (uploads it as an artifact to commit)'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

# Read the repo; open/update the one gate-failure issue. Nothing else.
permissions:
  contents: read

# One bench run at a time, and never cancel one (#2247). `cancel-in-progress:
# false` matches release.yml rather than ci.yml, for a reason specific to this
# workflow: a half-finished benchmark produces no usable number, so cancelling
# wastes the run outright — and two overlapping runs (easy during a re-blessing
# session, where you dispatch, look, and dispatch again) would measure each
# other's CPU contention. That corrupts the output of the one workflow whose
# entire product is a measurement. There is no latency pressure on a weekly
# schedule to trade against.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Unconditional lockfile/manifest check (#2244). Newly required here: this
      # job's install used to run unconditionally and WAS the assertion, until
      # #2247 put it behind a cache hit. `lockfile-gate.test.ts` caught that in
      # the same commit, which is the ratchet doing its job.
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      # Byte-identical key to ci.yml and release.yml so all four jobs share one
      # warm tree (#663, #1638) rather than this one keeping a fourth cache
      # namespace to itself. `tests/architecture/lockfile-gate.test.ts` asserts
      # the keys stay identical — drift there fails nothing, it just silently
      # stops the sharing.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Gating run (schedule + normal dispatch): fail on a >tolerance× regression
      # vs the committed baseline. `bench:check` runs the benches with JSON output
      # then diffs against tests/main/bench-baseline.json.
      - name: Run benchmarks + regression gate
        if: ${{ inputs.update_baseline != true }}
        # `pipefail` so the step's exit status is the gate's, not `tee`'s — the
        # whole point is that a non-zero here reaches the notify step below.
        run: |
          set -o pipefail
          pnpm bench:check 2>&1 | tee bench-report.txt

      # Re-bless run (dispatch with update_baseline=true): regenerate the baseline
      # and hand it back as an artifact for a human to commit.
      - name: Refresh benchmark baseline
        if: ${{ inputs.update_baseline == true }}
        run: pnpm bench:baseline

      - name: Upload refreshed baseline
        if: ${{ inputs.update_baseline == true }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-baseline
          path: tests/main/bench-baseline.json

      # Only for the SCHEDULED run (#2242). A failed manual dispatch already has
      # someone watching it — that is what dispatching means — and filing an
      # issue at them would train everyone to ignore the label.
      - name: Report the failure where someone will see it
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const TITLE = 'Bench: the regression gate is failing on main';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            let report = '(no bench-report.txt — the job failed before the gate ran)';
            try {
              // Keep the tail: the verdict table and the FAILED summary are the
              // last thing printed, and an issue body is capped at 65536 chars.
              report = fs.readFileSync('bench-report.txt', 'utf8').slice(-8000);
            } catch { /* step failed before the gate produced output */ }

            const body = [
              `Scheduled run ${new Date().toISOString().slice(0, 10)} — [run log](${run}).`,
              '',
              'The bench regression gate exited non-zero. This is the only check that',
              'runs outside the PR loop, so nothing else will surface it.',
              '',
              'Before treating a ratio as new code: the baseline is deliberately',
              'part-stale (see the `_comment` in `tests/main/bench-baseline.json`),',
              'seven save-path entries are held red BY DESIGN, and CI runs 1.2-1.4x',
              'slower than the machine older entries were blessed on. Compare against',
              'the previous scheduled run before bisecting.',
              '',
              '```',
              report,
              '```',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            // One issue, updated weekly — a new one every Monday is how a
            // notification path becomes noise and then becomes ignored.
            const existing = open.find((i) => !i.pull_request && i.title === TITLE);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Bench gate still failing — commented on #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
              });
              core.notice(`Bench gate failing — filed #${created.number}`);
            }
