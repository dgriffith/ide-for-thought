# Root-level pnpm settings (#2149 — pnpm 10 -> 12). As of pnpm 11/12 these are
# no longer read from package.json's `pnpm` key or from `.npmrc` — see
# https://pnpm.io/settings. Minerva is a single-package repo; this file exists
# purely to carry these settings, not to declare a multi-package workspace.

nodeLinker: hoisted

overrides:
  '@codemirror/view': 6.43.1
  '@codemirror/state': 6.7.1
  '@codemirror/language': 6.12.4
  d3-path: ^3.1.0
  parse-url: '>=8.1.0'
  tmp: '>=0.2.6'
  gry: '>=6.0.0'
  sharp: '>=0.35.4'
  adm-zip: '>=0.6.0'
  'rdflib>@xmldom/xmldom': '>=0.9.12'

# electron/esbuild/fs-xattr/macos-alias ship native postinstall builds we
# actually need (native module rebuilds, macOS alias-file support). Replaces
# the old onlyBuiltDependencies allowlist (pnpm v11 renamed it allowBuilds and
# made every other package's build script denied-by-default via
# strictDepBuilds, rather than silently allowed).
#
# @google/genai / onnxruntime-node / protobufjs / tesseract.js: explicitly
# denied, not newly reviewed-and-approved. pnpm 10 already silently ignored
# these same four packages' build scripts (a non-fatal "Ignored build
# scripts" warning every `pnpm install` printed pre-migration, confirmed
# against this session's own install log from before this bump); pnpm 12
# just turned that same state into a hard error (ERR_PNPM_IGNORED_BUILDS)
# unless every package with a build script is explicitly declared. Setting
# these to `true` would be a real behavior change (scripts that have never
# run start running) and is out of scope for a package-manager version bump.
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  '@google/genai': false
  onnxruntime-node: false
  protobufjs: false
  tesseract.js: false

# pnpm 12 defaults to blocking git-resolved subdependencies as a supply-chain
# guard. `@electron/rebuild` (used by electron-forge's native-module rebuild
# step) legitimately depends on `@electron/node-gyp` via a git tarball URL —
# that's Electron's own official tooling, not a third-party risk, so the
# default guard has nothing useful to catch here and only blocks a normal
# install.
blockExoticSubdeps: false
