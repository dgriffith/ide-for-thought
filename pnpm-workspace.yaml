# Root-level pnpm settings (#2149 — pnpm 10 -> 12). As of pnpm 11/12 these are
# no longer read from package.json's `pnpm` key or from `.npmrc` — see
# https://pnpm.io/settings. Minerva is a single-package repo; this file exists
# purely to carry these settings, not to declare a multi-package workspace.

nodeLinker: hoisted

overrides:
  '@codemirror/view': 6.43.1
  '@codemirror/state': 6.7.1
  '@codemirror/language': 6.12.4
  d3-path: ^3.1.0
  parse-url: '>=8.1.0'
  tmp: '>=0.2.6'
  gry: '>=6.0.0'
  sharp: '>=0.35.4'
  # Security overrides (#2154, low-risk subset — patch/minor bumps only,
  # no major-version jump). All five transitive resolutions sat below their
  # advisory's patched floor; forcing each one up fixes it regardless of
  # what the intermediate dependency (mostly electron-forge's own tree)
  # itself declares. Re-verify with `pnpm audit` after bumping.
  adm-zip: '>=0.6.1' # GHSA-vwc7-r8mq-g2x9 — symlink-following extraction
  'rdflib>@xmldom/xmldom': '>=0.9.12'
  # NOT the same override as the rdflib one above, and deliberately not
  # widened to a global key — tried that first and it broke `pnpm build`:
  # `@electron/packager`'s `plist` dependency calls xmldom's
  # `parseFromString(data)` with no `mimeType` argument, which 0.8.x
  # defaulted leniently and 0.9.x rejects outright
  # (`DOMParser.parseFromString: the provided mimeType "undefined" is not
  # valid.`, thrown from `plist/lib/parse.js` while packaging Info.plist).
  # That's a real breaking API change between the 0.8 and 0.9 lines, not
  # just a patch — so this pins `plist`'s xmldom edge to the *patched floor
  # within 0.8.x* (GHSA advisories here are fixed at >=0.8.15) instead of
  # jumping it to 0.9.x alongside rdflib's edge.
  'plist>@xmldom/xmldom': '>=0.8.15 <0.9.0'
  fast-uri: '>=3.1.4' # GHSA set — host-confusion / SSRF / path-traversal via malformed URIs
  browserslist: '>=4.28.7' # unbounded memory growth + prototype-write crash
  baseline-browser-mapping: '>=2.11.0' # GHSA-w5vr-8v7q-w6rv — process termination DoS
  # #2154's major-version bump: all three direct consumers (@electron/node-gyp,
  # cacache, @electron/rebuild) declare `^6.x`, so this is a real, deliberate
  # cross-major override, not a like-for-like patch. Verified with a full
  # `pnpm build` (electron-forge make, which exercises @electron/rebuild's
  # actual native-module extraction — the real call site) before landing,
  # not just `pnpm audit` going quiet. Fixes 12 advisories incl. 1 critical.
  tar: '>=7.5.21'

# electron/esbuild/fs-xattr/macos-alias ship native postinstall builds we
# actually need (native module rebuilds, macOS alias-file support). Replaces
# the old onlyBuiltDependencies allowlist (pnpm v11 renamed it allowBuilds and
# made every other package's build script denied-by-default via
# strictDepBuilds, rather than silently allowed).
#
# @google/genai / onnxruntime-node / protobufjs / tesseract.js: explicitly
# denied, not newly reviewed-and-approved. pnpm 10 already silently ignored
# these same four packages' build scripts (a non-fatal "Ignored build
# scripts" warning every `pnpm install` printed pre-migration, confirmed
# against this session's own install log from before this bump); pnpm 12
# just turned that same state into a hard error (ERR_PNPM_IGNORED_BUILDS)
# unless every package with a build script is explicitly declared. Setting
# these to `true` would be a real behavior change (scripts that have never
# run start running) and is out of scope for a package-manager version bump.
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  '@google/genai': false
  onnxruntime-node: false
  protobufjs: false
  tesseract.js: false

# pnpm 12 defaults to blocking git-resolved subdependencies as a supply-chain
# guard. `@electron/rebuild` (used by electron-forge's native-module rebuild
# step) legitimately depends on `@electron/node-gyp` via a git tarball URL —
# that's Electron's own official tooling, not a third-party risk, so the
# default guard has nothing useful to catch here and only blocks a normal
# install.
blockExoticSubdeps: false

# pnpm 12's default supply-chain guard against very-recently-published
# versions blocked the adm-zip 0.6.1 override above; auto-added by
# `pnpm install` when it hit that guard, kept since 0.6.1 is exactly the
# version #2154's security override intentionally pins to.
minimumReleaseAgeExclude:
  - adm-zip@0.6.1
