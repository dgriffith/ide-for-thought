<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Night-sky background gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2452"/>
      <stop offset="45%" stop-color="#232a5e"/>
      <stop offset="100%" stop-color="#3a2d6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#5a6bc4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a6bc4" stop-opacity="0"/>
    </radialGradient>
    <!-- Owl body gradient: warm brass/bronze -->
    <linearGradient id="plumage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9b96a"/>
      <stop offset="55%" stop-color="#cf9646"/>
      <stop offset="100%" stop-color="#a9742f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e2b8"/>
      <stop offset="100%" stop-color="#e3c489"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="60%" stop-color="#ffd97a"/>
      <stop offset="100%" stop-color="#d99a3a"/>
    </radialGradient>
    <!-- macOS squircle clip -->
    <clipPath id="squircle">
      <path d="M512 80
        C 832 80, 944 192, 944 512
        C 944 832, 832 944, 512 944
        C 192 944, 80 832, 80 512
        C 80 192, 192 80, 512 80 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <g clip-path="url(#squircle)">
    <rect x="80" y="80" width="864" height="864" fill="url(#sky)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#glow)"/>

    <!-- Twinkling stars -->
    <g fill="#fdf6df">
      <circle cx="220" cy="230" r="6"/>
      <circle cx="320" cy="170" r="3.5"/>
      <circle cx="800" cy="240" r="6.5"/>
      <circle cx="710" cy="160" r="3"/>
      <circle cx="860" cy="430" r="4"/>
      <circle cx="170" cy="430" r="4.5"/>
      <circle cx="260" cy="350" r="3"/>
      <circle cx="770" cy="360" r="3.5"/>
      <circle cx="150" cy="600" r="3"/>
      <circle cx="880" cy="600" r="3.5"/>
    </g>
    <!-- Four-point sparkle stars -->
    <g fill="#fff7e0">
      <path d="M620 200 L628 224 L652 232 L628 240 L620 264 L612 240 L588 232 L612 224 Z"/>
      <path d="M410 250 L416 268 L434 274 L416 280 L410 298 L404 280 L386 274 L404 268 Z"/>
      <path d="M840 330 L845 344 L859 349 L845 354 L840 368 L835 354 L821 349 L835 344 Z"/>
    </g>

    <!-- OWL -->
    <g>
      <!-- Body / lower plumage -->
      <path d="M512 880
        C 360 880, 300 760, 300 620
        C 300 470, 380 380, 512 380
        C 644 380, 724 470, 724 620
        C 724 760, 664 880, 512 880 Z"
        fill="url(#plumage)"/>

      <!-- Ear tufts -->
      <path d="M330 410 C 300 320, 320 270, 372 250 C 388 320, 392 372, 384 412 Z" fill="#b9802f"/>
      <path d="M694 410 C 724 320, 704 270, 652 250 C 636 320, 632 372, 640 412 Z" fill="#b9802f"/>

      <!-- Head -->
      <ellipse cx="512" cy="455" rx="232" ry="200" fill="url(#plumage)"/>

      <!-- Facial disc -->
      <path d="M512 290
        C 408 290, 350 360, 350 460
        C 350 560, 420 630, 512 630
        C 604 630, 674 560, 674 460
        C 674 360, 616 290, 512 290 Z"
        fill="url(#face)"/>

      <!-- Brow ridge dividing the disc -->
      <path d="M512 300 C 470 360, 470 540, 512 600 C 554 540, 554 360, 512 300 Z" fill="#d6b375" opacity="0.6"/>

      <!-- Eye sockets -->
      <circle cx="438" cy="450" r="92" fill="#3a2a18"/>
      <circle cx="586" cy="450" r="92" fill="#3a2a18"/>

      <!-- Eyes -->
      <circle cx="438" cy="450" r="74" fill="url(#eyeGlow)"/>
      <circle cx="586" cy="450" r="74" fill="url(#eyeGlow)"/>
      <circle cx="438" cy="450" r="34" fill="#241608"/>
      <circle cx="586" cy="450" r="34" fill="#241608"/>
      <!-- Catchlights -->
      <circle cx="452" cy="436" r="12" fill="#fffdf5"/>
      <circle cx="600" cy="436" r="12" fill="#fffdf5"/>
      <circle cx="424" cy="466" r="6" fill="#fffdf5" opacity="0.7"/>
      <circle cx="572" cy="466" r="6" fill="#fffdf5" opacity="0.7"/>

      <!-- Beak -->
      <path d="M512 470 L490 540 C 490 562, 534 562, 534 540 Z" fill="#caa24a"/>
      <path d="M512 470 L490 540 C 490 562, 534 562, 534 540 Z" fill="#000" opacity="0.08"/>

      <!-- Chest plumage marks -->
      <g fill="#9a6a28" opacity="0.55">
        <path d="M512 690 q -14 18 0 36 q 14 -18 0 -36 Z"/>
        <path d="M456 700 q -14 18 0 36 q 14 -18 0 -36 Z"/>
        <path d="M568 700 q -14 18 0 36 q 14 -18 0 -36 Z"/>
        <path d="M484 760 q -14 18 0 36 q 14 -18 0 -36 Z"/>
        <path d="M540 760 q -14 18 0 36 q 14 -18 0 -36 Z"/>
      </g>
    </g>
  </g>
</svg>
